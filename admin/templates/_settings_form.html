{% for group, rows in groups.items() %}
<section class="card settings-group">
  <h2>{{ group }}</h2>
  {% for row in rows %}{% include "_setting_row.html" %}{% endfor %}
</section>
{% endfor %}
<div class="row">
  <button class="btn danger" hx-post="/admin/settings/reset" hx-target="#settings-form"
          hx-confirm="確定要把所有權重與 tier 分數恢復成預設值嗎？">恢復預設值</button>
  {% if message %}<span class="saved" role="status">✓ {{ message }}</span>{% endif %}
</div>
