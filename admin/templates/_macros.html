{% macro avatar(h, size=40) -%}
{%- set url = avatar_url(h) -%}
{%- if url -%}
<img class="av" src="{{ url }}" alt="" width="{{ size }}" height="{{ size }}" loading="lazy">
{%- else -%}
<span class="av av-ph" aria-hidden="true" style="--c: {{ CLASS_COLORS.get(h.main_class, '#777') }}; --s: {{ size }}px">{{ h.name[:1] }}</span>
{%- endif -%}
{%- endmacro %}

{% macro lane_tags(lanes) -%}
{%- for lane, tier in lanes.items() -%}
<span class="tag lane-tag{% if tier %} tier-{{ tier }}{% endif %}">{{ lane }}{% if tier %} {{ tier }}{% else %} 未評{% endif %}</span>
{%- endfor -%}
{%- endmacro %}
